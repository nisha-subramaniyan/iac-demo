---
- name: Configure local machine with Ansible
  hosts: local
  become: true
  gather_facts: true

  tasks:
    - name: Install Nginx package
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create deployment user
      ansible.builtin.user:
        name: deployuser
        state: present
        shell: /bin/bash
        create_home: true

    - name: Ensure Nginx service is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
